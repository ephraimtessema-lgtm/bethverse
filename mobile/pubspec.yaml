name: bethverse
description: BethVerse — offline poetry vault (Android)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  file_picker: ^8.1.6
  local_auth: ^2.3.0
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  google_mlkit_text_recognition: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
